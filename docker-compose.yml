services:
  postgres:
    image: postgres:16-alpine
    container_name: bulkup-raptor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bulkup_raptor
      POSTGRES_USER: bulkup
      POSTGRES_PASSWORD: bulkup1234
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulkup -d bulkup_raptor"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: bulkup-raptor-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
