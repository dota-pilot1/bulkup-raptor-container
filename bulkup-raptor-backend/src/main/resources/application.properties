spring.application.name=bulkup-raptor-backend

# Load local settings when starting from the backend directory.
spring.config.import=optional:file:./.env[.properties]

# Server Configuration
server.port=8090

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/bulkup_raptor
spring.datasource.username=bulkup
spring.datasource.password=bulkup1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Adopt existing local databases without rebuilding their member data.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Local email verification (Mailpit)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.test-connection=false

# Read model SQL uses the same DataSource / JPA transaction manager.
mybatis.mapper-locations=classpath:mappers/**/*.xml
# Avoid stale reads after a JPA write in the same transaction.
mybatis.configuration.local-cache-scope=STATEMENT

# A single image is limited to 5 MiB; allow space for multipart headers.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.endpoint=${R2_ENDPOINT:}
app.r2.bucket=${R2_BUCKET:}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# PortOne V2 verification (server only)
app.portone.api-secret=${PORTONE_API_SECRET:}
app.portone.store-id=${PORTONE_STORE_ID:}
app.portone.channel-key=${PORTONE_KAKAOPAY_CHANNEL_KEY:}
app.portone.base-url=${PORTONE_API_BASE_URL:https://api.portone.io}

# 포트원 API 시크릿과 별개인 웹훅 서명 검증용 시크릿이다.
app.portone.webhook-secret=${PORTONE_WEBHOOK_SECRET:}
